[project]
name = "github_ai_catchbot"
version = "0.1.0"
description = "github_ai_catchbot initial implementation scaffold"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.1,<4",
  "PyJWT[crypto]>=2,<3",
  "redis>=5,<6",
  "openai>=1.99,<3",
]

[project.optional-dependencies]
test = [
  "pytest-asyncio>=1,<2",
]

[tool.alembic]
script_location = "migrations"
